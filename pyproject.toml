[project]
name = "beyond-all-reason-reinforcement-learning"
version = "0.1.0"
description = "Beyond All Reason as a reinforcement learning environment, and agents trained on it"
requires-python = ">=3.11"
dependencies = ["gymnasium>=1.0", "matplotlib>=3.8", "pandas>=2.2", "pyarrow>=16", "streamlit>=1.40", "plotly>=5.24"]

[project.optional-dependencies]
# pip install -e ".[development]"
development = ["ruff", "basedpyright", "pytest"]
# pip install -e ".[reinforcement_learning]": beyond_all_reason_reinforcement_learning, the agents trained with
# Maxalaar_Reinforcement_Learning (Ray RLlib). beyond_all_reason_environment needs none of them.
reinforcement_learning = [
    "ray[rllib]==2.54.0",
    "torch",
    "maxalaar-reinforcement-learning @ git+https://github.com/Maxalaar/Maxalaar_Reinforcement_Learning.git",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beyond_all_reason_environment = ["lua/**/*.lua"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear, simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src", "scripts", "configurations", "tests"]
exclude = ["game_data", "reference", "runs"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[tool.pytest.ini_options]
# Tests marked "engine" start the game engine (about 20 seconds each): pytest -m engine
markers = ["engine: starts the game engine"]
addopts = "-m 'not engine'"
